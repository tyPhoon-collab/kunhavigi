name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main, test_ci ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Build Flutter Web and Commit Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get workspace dependencies
        run: dart pub get

      - name: Get Flutter dependencies
        working-directory: kunhavigi_flutter
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: kunhavigi_flutter
        run: flutter build web --release --output=../kunhavigi_server/web/static

      - name: Configure Git
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check for changes
        if: github.event_name != 'pull_request'
        id: check_changes
        run: |
          git add kunhavigi_server/web/static
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit build artifacts
        if: github.event_name != 'pull_request' && steps.check_changes.outputs.changes == 'true'
        run: |
          git commit -m "ci: Update Flutter Web build artifacts

          - Built from commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Workflow: ${{ github.workflow }}

          Auto-generated by GitHub Actions"

      - name: Push changes
        if: github.event_name != 'pull_request' && steps.check_changes.outputs.changes == 'true'
        run: git push origin HEAD

      - name: No changes detected
        if: github.event_name != 'pull_request' && steps.check_changes.outputs.changes == 'false'
        run: echo "No changes detected in build artifacts. Skipping commit."

      - name: Build verification for PR
        if: github.event_name == 'pull_request'
        run: echo "✅ Flutter Web build completed successfully for pull request"
